const aralik=(a,b)=>{const dt=Math.max(0,b-a)/3600000;KA.forEach(k=>o[k]+=ush(k)*dt)};
function uret(){
  const now=Date.now(),ms=[];
  if(o.insaat&&now>=o.insaat.bitis){aralik(o.sonGuncelleme,o.insaat.bitis);o.sonGuncelleme=Math.max(o.sonGuncelleme,o.insaat.bitis);const b=o.insaat.bina;o.binalar[b]++;o.insaat=null;ms.push(B[b].ad+" yükseltmesi tamamlandı!")}
  if(o.insaat2&&now>=o.insaat2.bitis){aralik(o.sonGuncelleme,o.insaat2.bitis);o.sonGuncelleme=Math.max(o.sonGuncelleme,o.insaat2.bitis);const b=o.insaat2.bina;o.binalar[b]++;o.insaat2=null;ms.push(B[b].ad+" yükseltmesi tamamlandı!")}
  if(o.takv&&now>=o.takv.bitis){for(const t in o.takv.asker)o.askerler[t]=(o.askerler[t]||0)+o.takv.asker[t];o.takv=null;ms.push("🛡️ Takviye askerlerin geri döndü!")}
  aralik(o.sonGuncelleme,now);o.sonGuncelleme=now;if(o.en)enYenile(now);
  if(o.egitim&&now>=o.egitim.bitis){const e=o.egitim;o.askerler[e.asker]=(o.askerler[e.asker]||0)+e.adet;o.egitim=null;ms.push(n$(e.adet)+" "+AS[e.asker].ad+" eğitildi!")}
  if(o.arg&&now>=o.arg.bitis){o.ar[o.arg.a]++;ms.push(AR[o.arg.a]+" araştırması tamamlandı!");o.arg=null}
  o.seferler=o.seferler.filter(sf=>{
    if(sf.durum==="doniyor"&&now>=sf.donus){
      for(const t in sf.hayatta)o.askerler[t]=(o.askerler[t]||0)+(sf.hayatta[t]||0);
      KA.forEach(k=>o[k]+=sf.yagma[k]||0);
      ms.push("🏠 Askerlerin "+sf.hedefAd+" seferinden döndü!");return false}
    return true});
  hsSinir();return ms;
}

function bonusParca(b,p=o){
  const k=p.kakt,P=[],ek=(l,x)=>{if(x>0)P.push({l,p:Math.round(x*10000)/10000})},ar=p.ar||{},kl=p.kl||{},kmd=p.kmd||{},keq=p.keq||{};
  if(b==="sal"||b==="sav")ek("🔬 Araştırma",arB(ar[b]||0));
  if(b==="eko"){ek("🔬 Ekonomi araştırması",arB(ar.eko||0));if(p===o){ek("👑 VIP",.02*vip());ek("🏰 İttifak kalesi",kBonus())}}
  ek("📅 Günün etkinliği",etk(b));
  ek("🤝 İttifak teknolojisi",.01*(p.ittifak?(p.itb||{})[b]||0:0));
  if(k&&KM[k]&&KM[k].b===b){ek(KM[k].ik+" "+KM[k].ad+" Sv"+(kmd[k]||1),.03*(kmd[k]||1)+.004*((kl[k]||1)-1));ek("🎽 Komutan ekipmanı",.015*(keq[k]||0))}
  if(b==="sav")ek("🧱 Duvar",duvB((p.binalar||{}).duvar||1));
  return P;
}
const komStr=p=>{const k=p&&p.kakt;return k&&KM[k]&&(p.kmd||{})[k]?KM[k].ik+" "+KM[k].ad+" • ⭐"+p.kmd[k]+" • Sv"+((p.kl||{})[k]||1)+" • 🎽"+((p.keq||{})[k]||0)+"/10":""};
function birlikTab(sent,oran){const R=[];for(const t in AS){const n=sent[t]||0;if(!n)continue;const l=Math.min(n,Math.ceil(n*oran)),y=Math.floor(l/2);R.push({t,g:n,o:l-y,y})}return R}

const rapor=(m,tip="bilgi",ek={})=>{o.raporlar.unshift({t:Date.now(),tip,s:ek.s||"n",b:ek.b||"",d:ek.d||[],x:ek.x||null,m:String(m).replace(/<[^>]*>/g,"")});o.raporlar=o.raporlar.slice(0,60)};

async function yukselt(b){
  uret();const ik=o.binalar.karargah>=5;if([o.insaat,o.insaat2].some(q=>q&&q.bina===b))return bilgi("Bu bina zaten yükseltiliyor.");if(o.insaat&&(!ik||o.insaat2))return bilgi(ik?"İki inşaat kuyruğu da dolu.":"Zaten bir inşaat sürüyor (2. kuyruk Karargah Sv 5'te açılır).");
  const l=o.binalar[b];if(l>=MAX)return bilgi("Maksimum seviye.");
  const m=mal(b,l);if(KA.some((k,i)=>o[k]<m[i]))return bilgi("Yeterli kaynak yok.");
  KA.forEach((k,i)=>o[k]-=m[i]);const n=Date.now();
  const yk={bina:b,baslangic:n,bitis:n+sure(l)*1000};if(o.insaat)o.insaat2=yk;else o.insaat=yk;gp("yuk");bilgi(B[b].ad+" yükseltiliyor...");ciz();await kaydet();
}
async function egit(t){
  uret();if(o.egitim)return bilgi("Zaten bir eğitim sürüyor.");
  const A=AS[t];if(o.binalar.kisla<A.k)return bilgi("Kışla seviyesi yetersiz.");
  const n=Math.floor(Number($("n_"+t).value));if(!(n>=1))return bilgi("Geçerli bir adet gir.");
