<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mafya Şehri</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;text-align:center;margin:0}
h1{color:#e0b04a}#auth{padding:20px}
input[type=text],input[type=password],input[type=number]{padding:10px;width:80%;max-width:300px;border-radius:6px;border:0;box-sizing:border-box}
button{padding:10px 16px;border-radius:6px;border:0;background:#e0b04a;font-weight:bold}
button:disabled{background:#555;color:#999}
#mesaj{color:#f66}
#bar{display:flex;gap:6px;padding:10px;background:#1c1c1c;position:sticky;top:0;z-index:5}
.k{flex:1;background:#262626;border-radius:8px;padding:6px 2px}.k i{font-style:normal;font-size:20px;display:block}.k b{font-size:16px}.k small{display:block;font-size:11px;color:#8c8}
#sk{display:flex;gap:6px;padding:8px 10px 0;max-width:500px;margin:0 auto}.sk{flex:1;background:#262626;color:#ccc;padding:10px 4px}.sk.on{background:#e0b04a;color:#111}
#ana{padding:12px;max-width:500px;margin:0 auto}#bilgi{min-height:20px;font-size:14px;color:#e0b04a;margin:6px 0}
.c{background:#1c1c1c;border-radius:10px;padding:14px;margin:10px 0;text-align:left}
.u{display:flex;align-items:center;gap:8px}.u span:first-child{font-size:28px}
.sv{margin-left:auto;background:#e0b04a;color:#111;border-radius:6px;padding:2px 8px;font-weight:bold;font-size:13px}
.a{font-size:13px;color:#aaa;margin:6px 0}.yok{color:#f66}.d{font-size:13px;color:#e0b04a;min-height:16px}
.cb{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-top:4px}.cb div{height:100%;background:#e0b04a;width:0}
.c button{width:100%;margin-top:6px}.r{display:flex;gap:6px;margin-top:8px}.r input{flex:1;width:auto}.r button{width:auto;margin:0}
.rp{font-size:13px;text-align:left;border-bottom:1px solid #333;padding:6px 0}
.c .yb{width:auto;margin:0 0 0 6px;padding:4px 8px}
</style></head><body>
<div id="auth">
 <h1>Mafya Şehri</h1>
 <input id="kadi" type="text" placeholder="Kullanıcı adı" autocapitalize="none" autocomplete="username"><br><br>
 <input id="sifre" type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password"><br><br>
 <label><input id="hatirla" type="checkbox"> Beni hatırla</label><br><br>
 <button id="girisBtn">Giriş Yap</button> <button id="kayitBtn">Kayıt Ol</button>
 <p id="mesaj"></p>
</div>
<div id="oyun" style="display:none">
 <div id="bar">
  <div class="k"><i>💵</i><b id="para">0</b><small id="paraS"></small></div>
  <div class="k"><i>🔫</i><b id="silah">0</b><small id="silahS"></small></div>
  <div class="k"><i>🍞</i><b id="yiyecek">0</b><small id="yiyecekS"></small></div>
 </div>
 <div id="sk"><button class="sk on" id="s1">🏙 Şehir</button><button class="sk" id="s2">⚔️ Ordu</button><button class="sk" id="s3">💥 Savaş</button><button class="sk" id="s4">🤝 İttifak</button></div>
 <div id="ana">
  <p>Patron: <b id="kullanici"></b></p><div id="bilgi"></div>
  <div id="t1"></div>
  <div id="t2" style="display:none">
   <div class="c">⚔️ Saldırı: <b id="topS">0</b> &nbsp; 🛡️ Savunma: <b id="topV">0</b></div>
   <div class="c" id="egK" style="display:none"><div class="d" id="egY"></div><div class="cb"><div id="egC"></div></div></div>
   <div id="hs"></div><div id="askerler"></div>
  </div>
  <div id="t3" style="display:none">
   <button id="bulBtn" style="width:100%">🏆 Sıralama & Rakipler</button>
   <div id="sef"></div><div id="sKutu"></div><div id="rakipler"></div>
   <h3>📜 Savaş Raporları</h3><div id="rap"></div>
  </div>
  <div id="t4" style="display:none"></div>
  <br><button id="cikisBtn">Çıkış</button><br><br>
 </div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence,browserSessionPersistence}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,collection,getDocs,query,limit,arrayUnion,arrayRemove,onSnapshot,deleteField,orderBy,addDoc,increment,where}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyCKOWtGDm2-RwFOGT2UqaHUUYkB_zvxZI0",authDomain:"mafya-a6889.firebaseapp.com",projectId:"mafya-a6889",storageBucket:"mafya-a6889.firebasestorage.app",messagingSenderId:"717053621251",appId:"1:717053621251:web:2f2d5c9f80685f4f020a36"});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),LS=localStorage;

// ---------- GİRİŞ / BENİ HATIRLA ----------
$("kadi").value=LS.getItem("mk")||"";$("sifre").value=LS.getItem("ms")||"";$("hatirla").checked=LS.getItem("mh")==="1";
const hatirlaKaydet=k=>{
  if($("hatirla").checked){LS.setItem("mk",k);LS.setItem("ms",$("sifre").value);LS.setItem("mh","1")}
  else{LS.removeItem("mk");LS.removeItem("ms");LS.setItem("mh","0")}
};
const kadiAl=()=>$("kadi").value.trim().toLowerCase(),mail=k=>k+"@mafya.oyun";
const hataYaz=e=>{$("mesaj").textContent={"auth/email-already-in-use":"Bu kullanıcı adı zaten alınmış.","auth/invalid-credential":"Kullanıcı adı veya şifre hatalı.","auth/too-many-requests":"Çok fazla deneme, biraz bekle.","auth/network-request-failed":"İnternet bağlantısı hatası."}[e.code]||e.message};
const kalici=()=>setPersistence(auth,$("hatirla").checked?browserLocalPersistence:browserSessionPersistence);
$("kayitBtn").onclick=async()=>{
  $("mesaj").textContent="";const k=kadiAl();
  if(!/^[a-z0-9_]{3,15}$/.test(k))return $("mesaj").textContent="Kullanıcı adı 3-15 karakter; harf (Türkçe karakter hariç), rakam ve _ olabilir.";
  if($("sifre").value.length<6)return $("mesaj").textContent="Şifre en az 6 karakter olmalı.";
  try{await kalici();await createUserWithEmailAndPassword(auth,mail(k),$("sifre").value);hatirlaKaydet(k)}catch(e){hataYaz(e)}
};
$("girisBtn").onclick=async()=>{
  $("mesaj").textContent="";const k=kadiAl();
  if(!k||!$("sifre").value)return $("mesaj").textContent="Kullanıcı adı ve şifre gir.";
  try{await kalici();await signInWithEmailAndPassword(auth,mail(k),$("sifre").value);hatirlaKaydet(k)}catch(e){hataYaz(e)}
};
$("cikisBtn").onclick=()=>signOut(auth);

// ---------- SEKMELER ----------
const sekme=n=>{[1,2,3,4].forEach(i=>{$("t"+i).style.display=i===n?"block":"none";$("s"+i).classList.toggle("on",i===n)});if(n===4&&o)ittifakCiz()};
[1,2,3,4].forEach(i=>$("s"+i).onclick=()=>sekme(i));

// ---------- AYARLAR ----------
const KA=["para","silah","yiyecek"],IK={para:"💵",silah:"🔫",yiyecek:"🍞"},MAX=10,KORUMA=7200000; // yeni oyuncu 2 saat korumalı
const B={
 kumarhane:{ad:"Kumarhane",ik:"🎰",u:"para",baz:600,m:[150,50,50]},
 silahatolyesi:{ad:"Silah Atölyesi",ik:"🔫",u:"silah",baz:300,m:[150,50,50]},
 restoran:{ad:"Restoran",ik:"🍝",u:"yiyecek",baz:300,m:[150,50,50]},
 karargah:{ad:"Karargah",ik:"🏛️",m:[250,100,100]},
 kisla:{ad:"Kışla",ik:"🏚️",m:[200,80,80]}};
// k: gereken Kışla seviyesi | s: saldırı | v: savunma | t: 1 askerin eğitim süresi (sn)
const AS={
 serseri:{ad:"Sokak Serserisi",ik:"🧢",k:1,s:10,v:8,m:[50,10,20],t:10},
 tetikci:{ad:"Tetikçi",ik:"🕶️",k:3,s:30,v:15,m:[150,40,50],t:25},
 nisanci:{ad:"Keskin Nişancı",ik:"🎯",k:5,s:70,v:25,m:[400,120,120],t:60},
 muhafiz:{ad:"Zırhlı Muhafız",ik:"🛡️",k:7,s:60,v:120,m:[600,200,200],t:90}};

let uid=null,o=null,tick=null,sav=null,unsub=null;const uyg=new Set();
const n$=n=>Math.floor(n).toLocaleString("tr-TR"),bilgi=m=>$("bilgi").textContent=m;
const sureYaz=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),d=Math.floor(s%3600/60);return(h?h+"sa ":"")+(h||d?d+"dk ":"")+s%60+"sn"};
const ind=l=>Math.min(60,5*(l-1));
const mal=(b,l)=>KA.map((k,i)=>Math.floor(B[b].m[i]*Math.pow(1.8,l-1)));
const sure=l=>Math.ceil(20*Math.pow(1.8,l-1)*Math.max(.4,1-.05*(o.binalar.karargah-1)));
const es=(t,n)=>Math.ceil(AS[t].t*n*Math.max(.4,1-.05*(o.binalar.kisla-1)));
const maksAdet=t=>Math.max(0,Math.min(...KA.map((k,i)=>Math.floor(o[k]/AS[t].m[i]))));
const ush=k=>Object.keys(B).reduce((t,b)=>t+(B[b].u===k?B[b].baz*o.binalar[b]:0),0)*(1+.05*o.ar.eko);
const gucler=a=>{let s=0,v=0;for(const t in AS){s+=(a[t]||0)*AS[t].s;v+=(a[t]||0)*AS[t].v}return[s,v]};
const maliyetHtml=(m,have)=>KA.map((k,i)=>`<span class="${have[k]<m[i]?"yok":""}">${IK[k]} ${n$(m[i])}</span>`).join(" &nbsp; ");

// ---------- ÜRETİM ----------
const aralik=(a,b)=>{const dt=Math.max(0,b-a)/3600000;KA.forEach(k=>o[k]+=ush(k)*dt)};
function uret(){
  const now=Date.now(),ms=[];
  if(o.insaat&&now>=o.insaat.bitis){aralik(o.sonGuncelleme,o.insaat.bitis);o.sonGuncelleme=Math.max(o.sonGuncelleme,o.insaat.bitis);const b=o.insaat.bina;o.binalar[b]++;o.insaat=null;ms.push(B[b].ad+" yükseltmesi tamamlandı!")}
  aralik(o.sonGuncelleme,now);o.sonGuncelleme=now;
  if(o.egitim&&now>=o.egitim.bitis){const e=o.egitim;o.askerler[e.asker]=(o.askerler[e.asker]||0)+e.adet;o.egitim=null;ms.push(n$(e.adet)+" "+AS[e.asker].ad+" eğitildi!")}
  o.seferler=o.seferler.filter(sf=>{
    if(sf.durum==="doniyor"&&now>=sf.donus){
      for(const t in sf.hayatta)o.askerler[t]=(o.askerler[t]||0)+(sf.hayatta[t]||0);
      KA.forEach(k=>o[k]+=sf.yagma[k]||0);
      ms.push("🏠 Askerlerin "+sf.hedefAd+" seferinden döndü!");return false}
    return true});
  return ms;
}
async function kaydet(){
  if(!uid||!o)return;uret();
  const g=gucler(o.askerler);o.guc=g[0]+g[1];
  try{await updateDoc(doc(db,"oyuncular",uid),{para:o.para,silah:o.silah,yiyecek:o.yiyecek,binalar:o.binalar,insaat:o.insaat,askerler:o.askerler,egitim:o.egitim,raporlar:o.raporlar,ittifak:o.ittifak,seferler:o.seferler,yardimIste:!!(o.insaat||o.egitim),guc:o.guc,hastane:o.hastane,ar:o.ar,gun:o.gun,odul:o.odul,sonGuncelleme:o.sonGuncelleme})}catch(e){console.error(e)}
}
const rapor=m=>{o.raporlar.unshift(m);o.raporlar=o.raporlar.slice(0,10)};

// ---------- BİNA / ASKER ----------
async function yukselt(b){
  uret();if(o.insaat)return bilgi("Zaten bir inşaat sürüyor.");
  const l=o.binalar[b];if(l>=MAX)return bilgi("Maksimum seviye.");
  const m=mal(b,l);if(KA.some((k,i)=>o[k]<m[i]))return bilgi("Yeterli kaynak yok.");
  KA.forEach((k,i)=>o[k]-=m[i]);const n=Date.now();
  o.insaat={bina:b,baslangic:n,bitis:n+sure(l)*1000};gp("yuk");bilgi(B[b].ad+" yükseltiliyor...");ciz();await kaydet();
}
async function egit(t){
  uret();if(o.egitim)return bilgi("Zaten bir eğitim sürüyor.");
  const A=AS[t];if(o.binalar.kisla<A.k)return bilgi("Kışla seviyesi yetersiz.");
  const n=Math.floor(Number($("n_"+t).value));if(!(n>=1))return bilgi("Geçerli bir adet gir.");
  if(KA.some((k,i)=>o[k]<A.m[i]*n))return bilgi("Yeterli kaynak yok.");
  KA.forEach((k,i)=>o[k]-=A.m[i]*n);const now=Date.now();
  o.egitim={asker:t,adet:n,baslangic:now,bitis:now+es(t,n)*1000};gp("egit",n);bilgi(n$(n)+" "+A.ad+" eğitiliyor...");ciz();await kaydet();
}

// ---------- SAVAŞ ----------
async function rakipBul(){
  $("rakipler").innerHTML="Aranıyor...";
  try{
    const s=await getDocs(query(collection(db,"oyuncular"),orderBy("guc","desc"),limit(25)));let h="",r=0;
    s.forEach(d=>{
      r++;if(d.id===uid)return;const v=(RK[d.id]=d.data()),mut=!!o.ittifak&&v.ittifak===o.ittifak,kor=mut||Date.now()<(v.olusturma||0)+KORUMA;
      h+=`<div class="c"><div class="u"><span>#${r}</span><b>${esc(v.kullaniciAdi||"?")}</b><span class="sv">Güç ${n$(v.guc||0)}</span></div><button data-id="${d.id}" data-ad="${esc(v.kullaniciAdi||"?")}" ${kor?"disabled":""}>${mut?"🤝 Müttefik":kor?"🛡 Korumalı":"💥 Saldır"}</button><button data-c="${d.id}">🕵️ Casusla (💵100)</button></div>`;
    });
    $("rakipler").innerHTML=h||'<div class="c">Henüz başka oyuncu yok. Arkadaşlarını davet et!</div>';
    $("rakipler").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>saldirPaneli(b.dataset.id,b.dataset.ad));$("rakipler").querySelectorAll("button[data-c]").forEach(b=>b.onclick=()=>casus(b.dataset.c));
  }catch(e){$("rakipler").innerHTML='<div class="c">Liste alınamadı: '+e.message+'</div>'}
}
const HIZ={serseri:30,tetikci:45,nisanci:60,muhafiz:90},isl=new Set(); // yürüyüş süresi (sn), en yavaş askere göre
function saldirPaneli(vid,ad){
  uret();if(o.seferler.length>=3)return bilgi("En fazla 3 sefer aynı anda yürüyebilir.");
  $("sKutu").innerHTML=`<div class="c"><b>💥 Hedef: ${esc(ad)}</b>${Object.keys(AS).map(t=>`<div class="r"><span style="flex:1;text-align:left">${AS[t].ik} ${AS[t].ad} (${n$(o.askerler[t]||0)})</span><input type="number" id="g_${t}" value="0" min="0" max="${o.askerler[t]||0}" inputmode="numeric"></div>`).join("")}<div class="a">Yürüyüş süresi en yavaş askerin hızına göre belirlenir.</div><div class="r"><button id="gonBtn">Gönder</button><button id="iptBtn">İptal</button></div></div>`;
  $("gonBtn").onclick=()=>gonder(vid,ad);$("iptBtn").onclick=()=>$("sKutu").innerHTML="";
}
async function gonder(vid,ad){
  uret();if(o.seferler.length>=3)return bilgi("En fazla 3 sefer.");
  const a={};let top=0,yol=0;
  for(const t in AS){const n=Math.min(o.askerler[t]||0,Math.max(0,Math.floor(Number($("g_"+t).value)||0)));a[t]=n;top+=n;if(n>0)yol=Math.max(yol,HIZ[t])}
  if(!top)return bilgi("Gönderilecek asker seç.");
  for(const t in a)o.askerler[t]-=a[t];
  const now=Date.now();
  gp("sal");o.seferler.push({id:now+"_"+uid.slice(0,5),hedef:vid,hedefAd:ad,asker:a,yol,varis:now+yol*1000,durum:"gidiyor"});
  $("sKutu").innerHTML="";bilgi(`➡️ ${ad} şehrine ${n$(top)} asker yola çıktı (${sureYaz(yol)}).`);ciz();await kaydet();
}
function seferIsle(){
  const n=Date.now();
  o.seferler.forEach(sf=>{if(sf.durum==="gidiyor"&&n>=sf.varis&&!isl.has(sf.id)){isl.add(sf.id);savas(sf).finally(()=>isl.delete(sf.id))}});
}
// Askerler hedefe vardığında savaş burada çözülür
async function savas(sf){
  const vs=await getDoc(doc(db,"oyuncular",sf.hedef)),v=vs.exists()?vs.data():null;
  let m="",hay={...sf.asker},y={para:0,silah:0,yiyecek:0};
  if(!v)m="Hedef şehir bulunamadı, askerlerin geri dönüyor.";
  else if((o.ittifak&&v.ittifak===o.ittifak)||Date.now()<(v.olusturma||0)+KORUMA)m=`${esc(v.kullaniciAdi)} saldırıya uygun değildi (müttefik ya da korumalı). Askerlerin geri dönüyor.`;
  else{
    const A=gucler(sf.asker)[0]*(1+.05*o.ar.sal),D=100+gucler(v.askerler||{})[1]*(1+.05*((v.ar||{}).sav||0)),kazan=A>D;
    const aK=kazan?Math.min(.6,.4*D/A):.7,dK=kazan?.6:Math.min(.4,.3*A/D);
    const W=kazan?await savasKontrol(v):null;
    KA.forEach(k=>y[k]=kazan?Math.floor((v[k]||0)*(W?.35:.25)):0);
    try{await updateDoc(doc(db,"oyuncular",sf.hedef),{gelen:arrayUnion({id:sf.id,kim:o.kullaniciAdi,kazandi:kazan,dKay:dK,yagma:y})})}
    catch(e){m="Saldırı iletilemedi: "+e.message;y={para:0,silah:0,yiyecek:0}}
    if(!m){
      for(const t in hay){const l=Math.ceil(hay[t]*aK);hay[t]-=l;o.hastane[t]=(o.hastane[t]||0)+Math.floor(l/2)}
      if(W)updateDoc(ittR(o.ittifak),{["puan.w"+W.savasBitis]:increment(1)}).catch(()=>{});
      m=kazan?`🏆 ${esc(v.kullaniciAdi)} şehrini yendin! Yağma: ${KA.map(k=>IK[k]+n$(y[k])).join(" ")} • Kaybın: %${Math.round(aK*100)}${W?" • ⚔️ İttifak savaşı +1 puan, yağma %35!":""}`
             :`💀 ${esc(v.kullaniciAdi)} şehrine yenildin. Askerlerinin %${Math.round(aK*100)}'ini kaybettin.`;
    }
  }
  sf.durum="doniyor";sf.hayatta=hay;sf.yagma=y;sf.donus=sf.varis+sf.yol*1000;
  rapor(m);bilgi(m);ciz();await kaydet();
}
// Bize gelen saldırıları uygula
async function uygula(g){
  uret();const yeni=g.filter(e=>!uyg.has(e.id));if(!yeni.length)return;
  yeni.forEach(e=>{
    uyg.add(e.id);
    for(const t in AS){const x=o.askerler[t]||0,l=Math.ceil(x*e.dKay);o.askerler[t]=x-l;o.hastane[t]=(o.hastane[t]||0)+Math.floor(l/2)}
    KA.forEach(k=>o[k]=Math.max(0,o[k]-(e.yagma[k]||0)));
    rapor(e.kazandi?`⚠️ ${e.kim} sana saldırdı ve kazandı! Yağma: ${KA.map(k=>IK[k]+n$(e.yagma[k])).join(" ")} • Askerlerinin %${Math.round(e.dKay*100)}'ini kaybettin.`
                    :`🛡️ ${e.kim} sana saldırdı ama savunmayı geçemedi! Askerlerinin %${Math.round(e.dKay*100)}'ini kaybettin.`);
  });
  bilgi(o.raporlar[0]);ciz();
  try{await updateDoc(doc(db,"oyuncular",uid),{gelen:arrayRemove(...g)})}catch(e){}
  await kaydet();
}

// ---------- ARAYÜZ ----------
function kartlar(){
  $("t1").innerHTML='<div id="gk"></div>'+Object.keys(B).map(b=>`<div class="c"><div class="u"><span>${B[b].ik}</span><b>${B[b].ad}</b><span class="sv" id="s_${b}"></span></div><div class="a" id="a_${b}"></div><div class="a" id="m_${b}"></div><div class="d" id="d_${b}"></div><div class="cb" id="c_${b}" style="display:none"><div></div></div><button id="b_${b}">Yükselt</button></div>`).join("");
  Object.keys(B).forEach(b=>$("b_"+b).onclick=()=>yukselt(b));$("t1").onclick=e=>{const g=e.target.dataset.g;if(g)gorevAl(g)};$("hs").onclick=e=>{if(e.target.id==="hsBtn")tedavi();else if(e.target.dataset.a)arGel(e.target.dataset.a)};
  $("askerler").innerHTML=Object.keys(AS).map(t=>`<div class="c"><div class="u"><span>${AS[t].ik}</span><b>${AS[t].ad}</b><span class="sv" id="e_${t}"></span></div><div class="a">⚔️ ${AS[t].s} &nbsp; 🛡️ ${AS[t].v}</div><div class="a" id="em_${t}"></div><div class="d" id="ed_${t}"></div><div class="r"><input type="number" id="n_${t}" value="1" min="1" inputmode="numeric"><button id="mx_${t}">Maks</button><button id="eb_${t}">Eğit</button></div></div>`).join("");
  Object.keys(AS).forEach(t=>{$("eb_"+t).onclick=()=>egit(t);$("mx_"+t).onclick=()=>$("n_"+t).value=Math.max(1,maksAdet(t))});
}
function ciz(){
  KA.forEach(k=>{$(k).textContent=n$(o[k]);$(k+"S").textContent="+"+n$(ush(k))+"/sa"});
  const now=Date.now();
  for(const b in B){
    const l=o.binalar[b],X=B[b],mx=l>=MAX;$("s_"+b).textContent="Sv "+l;
    $("a_"+b).textContent=X.u?`${IK[X.u]} ${n$(X.baz*l)}${mx?"":" → "+n$(X.baz*(l+1))} /saat`
      :`${b==="karargah"?"İnşaat":"Eğitim"} süresi: -%${ind(l)}${mx?"":" → -%"+ind(l+1)}${b==="kisla"?" • Yeni askerleri açar":""}`;
    const bt=$("b_"+b),cb=$("c_"+b),d=$("d_"+b);
    if(mx){$("m_"+b).textContent="";d.textContent="Maksimum seviye";bt.style.display="none";cb.style.display="none";continue}
    $("m_"+b).innerHTML=maliyetHtml(mal(b,l),o)+" &nbsp; ⏱ "+sureYaz(sure(l));
    if(o.insaat&&o.insaat.bina===b){const kalan=(o.insaat.bitis-now)/1000,top=(o.insaat.bitis-o.insaat.baslangic)/1000;d.textContent="🔨 Yükseltiliyor: "+sureYaz(kalan);cb.style.display="block";cb.firstChild.style.width=Math.min(100,100*(1-kalan/top))+"%";bt.disabled=true}
    else{d.textContent="";cb.style.display="none";bt.disabled=!!o.insaat}
  }
  const g=gucler(o.askerler);$("topS").textContent=n$(g[0]);$("topV").textContent=n$(g[1]);
  for(const t in AS){
    const A=AS[t],kil=o.binalar.kisla<A.k;
    $("e_"+t).textContent="x"+n$(o.askerler[t]||0);
    $("em_"+t).innerHTML=maliyetHtml(A.m,o)+" &nbsp; ⏱ "+sureYaz(es(t,1))+"/adet";
    $("ed_"+t).textContent=kil?"🔒 Kışla Sv "+A.k+" gerekli":"";
    $("eb_"+t).disabled=kil||!!o.egitim;$("mx_"+t).disabled=kil;$("n_"+t).disabled=kil;
  }
  if(o.egitim){const e=o.egitim,kalan=(e.bitis-now)/1000,top=(e.bitis-e.baslangic)/1000;$("egK").style.display="block";$("egY").textContent="🎯 Eğitimde: "+n$(e.adet)+" "+AS[e.asker].ad+" — "+sureYaz(kalan);$("egC").style.width=Math.min(100,100*(1-kalan/top))+"%"}
  else $("egK").style.display="none";
  $("sef").innerHTML=o.seferler.map(sf=>`<div class="c"><b>${sf.durum==="gidiyor"?"➡️ "+esc(sf.hedefAd)+" şehrine yürüyor":"⬅️ Şehre dönüyor"}</b><div class="d">${sureYaz(((sf.durum==="gidiyor"?sf.varis:sf.donus)-now)/1000)}</div><div class="a">${Object.keys(sf.asker).filter(t=>sf.asker[t]>0).map(t=>AS[t].ik+" "+n$(sf.asker[t])).join(" ")}</div></div>`).join("");
  $("rap").innerHTML=o.raporlar.length?o.raporlar.map(r=>`<div class="rp">${r}</div>`).join(""):'<div class="rp">Henüz savaş yok.</div>';gorevCiz();hsCiz();
}
// ---------- İTTİFAK ----------
let sohbetUnsub=null;const ITT_MALIYET=500,ittR=id=>doc(db,"ittifaklar",id),esc=t=>String(t).replace(/[&<>"']/g,"");
async function ittifakCiz(){
  const k=$("t4");k.innerHTML="Yükleniyor...";
  try{
    if(o.ittifak){
      const s=await getDoc(ittR(o.ittifak));
      if(!s.exists()||!(s.data().uyeler||{})[uid]){o.ittifak=null;await kaydet();return ittifakCiz()}
      const d=s.data(),u=d.uyeler,yi={};
      await Promise.all(Object.keys(u).map(async i=>{try{yi[i]=(await getDoc(doc(db,"oyuncular",i))).data().yardimIste}catch(e){}}));
      k.innerHTML=`<div class="c"><div class="u"><span>🤝</span><b>${esc(d.ad)}</b><span class="sv">${Object.keys(u).length} üye</span></div><div class="a">${Object.keys(u).map(i=>`<div>${i===d.lider?"👑":"🕴️"} ${esc(u[i])}${i!==uid&&yi[i]?` <button class="yb" data-y="${i}">🙋 Yardım et</button>`:""}</div>`).join("")}</div><div class="a">Müttefiklerine saldıramazsın.</div><button id="ayrBtn">Ayrıl</button></div>`;
      $("ayrBtn").onclick=ittifakAyril;
      k.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{b.disabled=true;yardimEt(b.dataset.y)});
      await savasKutu(k,d);await odulKutu(k,d);
      k.insertAdjacentHTML("beforeend",'<div class="c"><b>💬 Sohbet</b><div class="r"><input type="text" id="sohM" placeholder="Mesaj yaz..." maxlength="200"><button id="sohBtn">Gönder</button></div><div id="sohbet" style="max-height:260px;overflow:auto"></div></div>');
      $("sohBtn").onclick=sohbetGonder;sohbetBaslat(o.ittifak);
    }else{
      const s=await getDocs(query(collection(db,"ittifaklar"),limit(20)));let h="";
      s.forEach(x=>{const d=x.data(),n=Object.keys(d.uyeler||{}).length;if(n)h+=`<div class="c"><div class="u"><span>🤝</span><b>${esc(d.ad)}</b><span class="sv">${n} üye</span></div><button data-id="${x.id}">Katıl</button></div>`});
      k.innerHTML=`<div class="c"><b>Yeni ittifak kur</b> (💵 ${ITT_MALIYET})<div class="r"><input type="text" id="ittAd" placeholder="Ad (3-16 karakter, istediğin gibi)" autocapitalize="none"><button id="kurBtn">Kur</button></div></div><h3>Açık ittifaklar</h3>${h||'<div class="c">Henüz ittifak yok.</div>'}`;
      $("kurBtn").onclick=ittifakKur;
      k.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>ittifakKatil(b.dataset.id));
    }
  }catch(e){k.innerHTML='<div class="c">Hata: '+e.message+'</div>'}
}
// ---------- YARDIMLAŞMA & İTTİFAK SAVAŞI ----------
async function yardimEt(id){
  try{await updateDoc(doc(db,"oyuncular",id),{yardim:arrayUnion({id:uid+"_"+Date.now(),kim:o.kullaniciAdi})});bilgi("🙋 Yardım gönderildi!")}
  catch(e){bilgi("Yardım gönderilemedi: "+e.message)}
}
async function yardimUygula(y){ // gelen yardım: işlem başına en fazla 5 kez, her biri -1 dk
  uret();const yeni=y.filter(e=>!uyg.has(e.id));if(!yeni.length)return;
  yeni.forEach(e=>{uyg.add(e.id);const t=o.insaat||o.egitim;
    if(t&&(t.y||0)<5){t.bitis-=60000;t.y=(t.y||0)+1;rapor(`🙋 ${esc(e.kim)} sana yardım etti: -1 dk`);bilgi(o.raporlar[0])}});
  ciz();
  try{await updateDoc(doc(db,"oyuncular",uid),{yardim:arrayRemove(...y)})}catch(e){}
  await kaydet();
}
async function savasKontrol(v){ // iki ittifak arasında aktif savaş varsa savaş bilgisini döndürür
  if(!o.ittifak||!v.ittifak)return null;
  try{
    const[a,b]=await Promise.all([getDoc(ittR(o.ittifak)),getDoc(ittR(v.ittifak))]),n=Date.now();
    if(a.exists()&&a.data().dusman===v.ittifak&&a.data().savasBitis>n)return a.data();
    if(b.exists()&&b.data().dusman===o.ittifak&&b.data().savasBitis>n)return b.data();
  }catch(e){}
  return null;
}
async function savasKutu(k,d){
  const now=Date.now(),wars=[];
  try{
    if(d.dusman&&d.savasBitis>now){const e=(await getDoc(ittR(d.dusman))).data()||{};
      wars.push({a:d.ad,b:e.ad||"?",bit:d.savasBitis,ap:(d.puan||{})["w"+d.savasBitis]||0,bp:(e.puan||{})["w"+d.savasBitis]||0})}
    (await getDocs(query(collection(db,"ittifaklar"),where("dusman","==",o.ittifak)))).forEach(x=>{const w=x.data();
      if(w.savasBitis>now)wars.push({a:w.ad,b:d.ad,bit:w.savasBitis,ap:(w.puan||{})["w"+w.savasBitis]||0,bp:(d.puan||{})["w"+w.savasBitis]||0})});
  }catch(e){}
  let h='<div class="c"><b>⚔️ İttifak Savaşı</b>';
  h+=wars.length?wars.map(w=>`<div class="a">${esc(w.a)} <b>${w.ap}</b> – <b>${w.bp}</b> ${esc(w.b)}<br>Kalan: ${sureYaz((w.bit-now)/1000)}<br>Düşman üyelerini yenersen +1 puan ve yağma %35 olur.</div>`).join(""):'<div class="a">Aktif savaş yok.</div>';
  if(d.lider===uid&&!(d.dusman&&d.savasBitis>now)){
    let l="";
    try{(await getDocs(query(collection(db,"ittifaklar"),limit(20)))).forEach(x=>{const e=x.data();
      if(x.id!==o.ittifak&&Object.keys(e.uyeler||{}).length)l+=`<div class="r"><span style="flex:1;text-align:left">${esc(e.ad)}</span><button data-w="${x.id}">⚔️ Savaş ilan et</button></div>`})}catch(e){}
    h+=`<div class="a">Lider olarak 💵 1.000 karşılığında 24 saatlik savaş ilan edebilirsin.</div>${l||'<div class="a">Başka ittifak yok.</div>'}`;
  }
  k.insertAdjacentHTML("beforeend",h+"</div>");
  k.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>savasIlan(b.dataset.w));
}
async function savasIlan(id){
  uret();if(o.para<1000)return bilgi("Savaş ilanı için 💵 1.000 gerekli.");
  try{await updateDoc(ittR(o.ittifak),{dusman:id,savasBitis:Date.now()+86400000,puan:{}})}catch(e){return bilgi("İlan edilemedi: "+e.message)}
  o.para-=1000;bilgi("⚔️ Savaş ilan edildi! 24 saat sürecek.");ciz();await kaydet();ittifakCiz();
}
function sohbetBaslat(id){
  if(sohbetUnsub)sohbetUnsub();
  sohbetUnsub=onSnapshot(query(collection(db,"ittifaklar",id,"mesajlar"),orderBy("z","desc"),limit(30)),sn=>{
    const el=$("sohbet");if(!el)return;
    el.innerHTML=sn.docs.map(d=>{const x=d.data();return`<div class="rp"><b>${esc(x.kim)}:</b> ${esc(x.m)}</div>`}).join("")||'<div class="rp">Henüz mesaj yok.</div>';
  },e=>{const el=$("sohbet");if(el)el.innerHTML='<div class="rp">Sohbet açılamadı: '+e.message+'</div>'});
}
async function sohbetGonder(){
  const t=$("sohM").value.trim().slice(0,200);if(!t)return;
  try{await addDoc(collection(db,"ittifaklar",o.ittifak,"mesajlar"),{kim:o.kullaniciAdi,m:t,z:Date.now(),uid});$("sohM").value=""}
  catch(e){bilgi("Mesaj gönderilemedi: "+e.message)}
}
async function ittifakKur(){
  uret();const ad=$("ittAd").value.trim(),id=encodeURIComponent(ad.toLocaleLowerCase("tr")).replace(/\./g,"%2E");
  if(ad.length<3||ad.length>16)return bilgi("İttifak adı 3-16 karakter olmalı (istediğin karakteri kullanabilirsin).");
  if(o.para<ITT_MALIYET)return bilgi("Yeterli paran yok.");
  try{
    if((await getDoc(ittR(id))).exists())return bilgi("Bu ittifak adı alınmış.");
    await setDoc(ittR(id),{ad,lider:uid,uyeler:{[uid]:o.kullaniciAdi},olusturma:Date.now()});
  }catch(e){return bilgi("Kurulamadı: "+e.message)}
  o.para-=ITT_MALIYET;o.ittifak=id;bilgi("🤝 İttifak kuruldu!");ciz();await kaydet();ittifakCiz();
}
async function ittifakKatil(id){
  try{await updateDoc(ittR(id),{["uyeler."+uid]:o.kullaniciAdi})}catch(e){return bilgi("Katılamadı: "+e.message)}
  o.ittifak=id;bilgi("🤝 İttifaka katıldın!");await kaydet();ittifakCiz();
}
async function ittifakAyril(){
  try{
    const d=(await getDoc(ittR(o.ittifak))).data(),kalan=Object.keys(d.uyeler||{}).filter(i=>i!==uid),p={["uyeler."+uid]:deleteField()};
    if(d.lider===uid&&kalan.length)p.lider=kalan[0];
    await updateDoc(ittR(o.ittifak),p);
  }catch(e){return bilgi("Ayrılamadı: "+e.message)}
  if(sohbetUnsub){sohbetUnsub();sohbetUnsub=null}o.ittifak=null;bilgi("İttifaktan ayrıldın.");await kaydet();ittifakCiz();
}
// ---------- GÖREV / HASTANE / AR-GE / CASUS / SAVAŞ ÖDÜLÜ ----------
const GR={giris:[1,"Günlük giriş ödülü",[500,200,200]],yuk:[1,"Bir bina yükselt",[300,100,100]],egit:[10,"10 asker eğit",[200,50,50]],sal:[1,"Bir saldırı yap",[300,100,100]]};
const AR={sal:"⚔️ Saldırı eğitimi",sav:"🛡️ Savunma eğitimi",eko:"📈 Ekonomi"},arM=l=>[400,150,150].map(x=>Math.floor(x*Math.pow(1.7,l))),hsm=t=>AS[t].m.map(x=>Math.floor(x/2)),RK={};
const gunK=()=>{const t=new Date(Date.now()+10800000).toISOString().slice(0,10);if(o.gun.t!==t)o.gun={t,g:{giris:1},al:{}}};
const gp=(k,n=1)=>{gunK();o.gun.g[k]=(o.gun.g[k]||0)+n};
function gorevCiz(){
  gunK();const el=$("gk");if(!el)return;
  el.innerHTML='<div class="c"><b>📋 Günlük Görevler</b>'+Object.keys(GR).map(k=>{const[h,ad,r]=GR[k],p=Math.min(h,o.gun.g[k]||0),al=o.gun.al[k];return`<div class="r"><span style="flex:1;text-align:left">${ad} (${p}/${h})<br><small>${KA.map((x,i)=>IK[x]+n$(r[i])).join(" ")}</small></span><button data-g="${k}" ${al||p<h?"disabled":""}>${al?"✅":"Al"}</button></div>`}).join("")+"</div>";
}
async function gorevAl(k){gunK();const[h,,r]=GR[k];if(o.gun.al[k]||(o.gun.g[k]||0)<h)return;o.gun.al[k]=1;KA.forEach((x,i)=>o[x]+=r[i]);bilgi("🎁 Görev ödülü alındı!");ciz();await kaydet()}
function hsCiz(){
  const hs=Object.keys(AS).filter(t=>o.hastane[t]>0);
  $("hs").innerHTML='<div class="c"><b>🏥 Hastane</b><div class="a">'+(hs.length?hs.map(t=>AS[t].ik+" "+n$(o.hastane[t])).join(" &nbsp; "):"Yaralı yok")+'</div><div class="a">Savaşta kaybedilen askerlerin yarısı yaralanır; eğitim maliyetinin yarısına tedavi edilir.</div><button id="hsBtn" '+(hs.length?"":"disabled")+'>Tedavi et</button></div><div class="c"><b>🔬 Araştırma</b>'+Object.keys(AR).map(a=>{const l=o.ar[a];return`<div class="r"><span style="flex:1;text-align:left">${AR[a]} Sv ${l}/10 (+%${5*l})<br><small>${l>=10?"Maksimum":maliyetHtml(arM(l),o)}</small></span><button data-a="${a}" ${l>=10?"disabled":""}>Geliştir</button></div>`}).join("")+"</div>";
}
async function tedavi(){uret();let n=0;for(const t in AS){const c=hsm(t),w=o.hastane[t]||0,k=Math.min(w,...KA.map((x,i)=>Math.floor(o[x]/c[i])));if(k>0){KA.forEach((x,i)=>o[x]-=c[i]*k);o.hastane[t]-=k;o.askerler[t]=(o.askerler[t]||0)+k;n+=k}}bilgi(n?`🏥 ${n$(n)} asker tedavi edildi.`:"Tedavi için yeterli kaynak yok.");ciz();await kaydet()}
async function arGel(a){uret();const l=o.ar[a],m=arM(l);if(l>=10)return;if(KA.some((k,i)=>o[k]<m[i]))return bilgi("Yeterli kaynak yok.");KA.forEach((k,i)=>o[k]-=m[i]);o.ar[a]++;bilgi(AR[a]+" geliştirildi!");ciz();await kaydet()}
function casus(id){uret();const v=RK[id];if(!v)return;if(o.para<100)return bilgi("Casus için 💵 100 gerekli.");o.para-=100;bilgi(`🕵️ ${esc(v.kullaniciAdi)}: ${Object.keys(AS).map(t=>AS[t].ik+n$((v.askerler||{})[t]||0)).join(" ")} • ${KA.map(k=>IK[k]+n$(v[k]||0)).join(" ")}`);ciz();kaydet()}
async function odulKutu(k,d){
  const now=Date.now(),L=[];
  try{
    if(d.dusman&&d.savasBitis<=now){const e=(await getDoc(ittR(d.dusman))).data()||{};L.push([d.savasBitis,e.ad||"?",(d.puan||{})["w"+d.savasBitis]||0,(e.puan||{})["w"+d.savasBitis]||0])}
    (await getDocs(query(collection(db,"ittifaklar"),where("dusman","==",o.ittifak)))).forEach(x=>{const w=x.data();if(w.savasBitis<=now)L.push([w.savasBitis,w.ad,(d.puan||{})["w"+w.savasBitis]||0,(w.puan||{})["w"+w.savasBitis]||0])});
  }catch(e){}
  const W=L.filter(x=>x[2]>x[3]&&!o.odul.includes(x[0])&&now-x[0]<6048e5);
  if(W.length)k.insertAdjacentHTML("beforeend",'<div class="c"><b>🏆 Savaş Ödülü</b>'+W.map(x=>`<div class="r"><span style="flex:1;text-align:left">${esc(x[1])} savaşını kazandınız (${x[2]}–${x[3]})</span><button data-o="${x[0]}">💵2.000 🔫1.000 🍞1.000</button></div>`).join("")+"</div>");
  k.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>odulAl(Number(b.dataset.o)));
}
async function odulAl(b){if(o.odul.includes(b))return;o.odul.push(b);o.odul=o.odul.slice(-20);[2000,1000,1000].forEach((x,i)=>o[KA[i]]+=x);bilgi("🏆 Savaş ödülü alındı!");ciz();await kaydet();ittifakCiz()}
$("bulBtn").onclick=rakipBul;

// ---------- BAŞLAT / DURDUR ----------
async function baslat(u){
  uid=u.uid;const ref=doc(db,"oyuncular",uid),s=await getDoc(ref);
  if(s.exists())o=s.data();
  else{o={kullaniciAdi:u.email.split("@")[0],para:1000,silah:500,yiyecek:500,olusturma:Date.now(),sonGuncelleme:Date.now()};await setDoc(ref,o)}
  if(!o.sonGuncelleme)o.sonGuncelleme=Date.now();
  if(!o.olusturma)o.olusturma=Date.now();
  o.binalar=Object.assign({kumarhane:1,silahatolyesi:1,restoran:1,karargah:1,kisla:1},o.binalar||{});
  o.askerler=Object.assign({serseri:0,tetikci:0,nisanci:0,muhafiz:0},o.askerler||{});
  if(o.insaat===undefined)o.insaat=null;if(o.egitim===undefined)o.egitim=null;
  o.raporlar=o.raporlar||[];o.ittifak=o.ittifak||null;o.seferler=o.seferler||[];o.hastane=o.hastane||{};o.ar=Object.assign({sal:0,sav:0,eko:0},o.ar||{});o.gun=o.gun||{t:"",g:{},al:{}};o.odul=o.odul||[];
  const m=uret();if(m.length)bilgi("✅ "+m.join(" "));
  $("kullanici").textContent=o.kullaniciAdi||u.email.split("@")[0];
  kartlar();ciz();await kaydet();
  tick=setInterval(()=>{const mm=uret();if(mm.length){bilgi("✅ "+mm.join(" "));kaydet()}seferIsle();ciz()},1000);
  sav=setInterval(kaydet,30000);
  unsub=onSnapshot(ref,sn=>{const dd=sn.data()||{};if(!o)return;if(dd.gelen&&dd.gelen.length)uygula(dd.gelen);if(dd.yardim&&dd.yardim.length)yardimUygula(dd.yardim)});
}
async function durdur(){clearInterval(tick);clearInterval(sav);if(unsub)unsub();if(sohbetUnsub)sohbetUnsub();await kaydet();uid=null;o=null}
document.addEventListener("visibilitychange",()=>{if(document.hidden)kaydet()});
onAuthStateChanged(auth,async u=>{
  if(u){$("auth").style.display="none";$("oyun").style.display="block";await baslat(u)}
  else{await durdur();$("auth").style.display="block";$("oyun").style.display="none"}
});
</script></body></html>
